<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>To Do List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background-color: #FAFAFA;
            font-family: 'Nunito', sans-serif;
            padding-top: 50px;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Raleway', sans-serif;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .container {
            max-width: 550px;
            margin: auto;
            background-color: #fff;
            box-shadow: 2px 2px 13px -4px rgba(0, 0, 0, 0.21);
            padding: 20px;
            border-radius: 10px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            color: #fff;
            padding: 14px 18px;
            border-radius: 10px 10px 0 0;
            background: linear-gradient(90deg, #EEA390 0%, #EB796F 100%);
        }

        .header-bar a {
            color: rgb(247, 247, 247);
            text-decoration: none;
        }

        .header-bar a:hover {
            text-decoration: underline;
        }

        .logout-btn {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 6px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background-color: rgba(255, 255, 255, 0.35);
            text-decoration: none;
        }

        .task-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #fff;
            border-top: 1px solid #dfe4ea;
            overflow: hidden;
        }
        .task-title {
            display: flex;
            padding: 10px;
        }

        .task-title a {
            text-decoration: none;
            color: #4b5156;
            margin-left: 10px;
        }

        .task-complete-icon {
            height: 20px;
            width: 20px;
            background-color: rgb(73, 174, 73);
            border-radius: 50%;
        }

        .task-incomplete-icon {
            height: 20px;
            width: 20px;
            background-color: rgb(37, 35, 35);
            border-radius: 50%;
        }
        .delete-link {
            text-decoration: none;
            font-weight: 900;
            color: #cf4949;
            font-size: 22px;
            line-height: 0;
            padding: 20px 0px;
        }
        #add-link {
            color: #EB796F;
            text-decoration: none;
            font-size: 42px;
            text-shadow: 1px 1px #81413b;
        }

        #search-add-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        input[type=text],
        input[type=password],
        textarea {
            border: 1px solid #757575;
            border-radius: 5px;
            padding: 10px;
            width: 90%;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }
        input[type=text]:focus,
        input[type=password]:focus,
        textarea:focus {
            outline: none;
            border-color: #EB796F;
            box-shadow: 0 0 4px rgba(235, 121, 111, 0.5);
        }
        label {
            padding-top: 10px !important;
            display: block;
            font-weight: 600;
            color: #333;
        }
        .button {
            border: 1px solid #757575;
            background-color: #FFF;
            color: #171515;
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .button:hover {
            background-color: #f0f0f0;
        }
        .card-body {
            padding: 20px;
        }

        /* Form validation & Error styles */
        .form-group {
            margin-bottom: 14px;
        }
        .field-hint {
            display: block;
            font-size: 11px;
            color: #70757a;
            margin-top: 4px;
        }
        .field-error {
            background-color: #fce8e6;
            color: #c5221f;
            border-left: 3px solid #d93025;
            padding: 6px 10px;
            margin-top: 6px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            width: 90%;
            box-sizing: border-box;
        }
        .field-error p {
            margin: 0;
            padding: 2px 0;
        }
        .error-alert {
            background-color: #fce8e6;
            color: #c5221f;
            border: 1px solid #fad2cf;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: 500;
        }
        .error-alert p {
            margin: 0;
        }
        .errorlist {
            list-style-type: none;
            padding: 8px 12px;
            margin: 8px 0;
            background-color: #fce8e6;
            color: #c5221f;
            border-left: 3px solid #d93025;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            width: 90%;
            box-sizing: border-box;
        }
        .errorlist li {
            margin: 2px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}
        
        {% endblock content %}
    </div>
</body>
</html>
