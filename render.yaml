services:
  - type: web
    name: todo-app
    runtime: python
    rootDir: ProjectDjango/mylist
    buildCommand: ./build.sh
    startCommand: gunicorn mylist.wsgi:application --workers 2 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: 'False'
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString

databases:
  - name: todo-db
    databaseName: todolist
    user: todolist_user
    plan: free
